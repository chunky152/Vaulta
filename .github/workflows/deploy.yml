name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w @unbur/backend

      # Render builds from the repo itself; the hook just tells it to pull
      # and redeploy. Skips (instead of failing) until the secret is set.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl --fail -X POST "$RENDER_DEPLOY_HOOK"

  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The frontend is useless without a real API URL baked in; fail
      # loudly instead of shipping a bundle that calls its own origin.
      - name: Check VITE_API_URL is configured
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::The VITE_API_URL repository variable is not set (Settings -> Secrets and variables -> Actions -> Variables). Set it to the backend URL + /api/v1."
            exit 1
          fi

      - name: Build
        run: npm run build -w @unbur/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Skips (instead of failing) until the Cloudflare secrets are set.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vaulta-web
          directory: packages/web/dist
          branch: main
